[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-import-profiler"
version = "0.1.0"
description = "Show how long each Python import takes during startup"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["import", "profiler", "startup", "performance", "timing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-import-profiler"
Repository = "https://github.com/philiprehberger/py-import-profiler"
Issues = "https://github.com/philiprehberger/py-import-profiler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_import_profiler"]
